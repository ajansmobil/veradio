<!-- =====================================================
  ARZCDR MODÜLÜ — Veradio Canlı Yayın + Chat + AI Asistan
  Yapı: Üstte logo | Yatayda 3 sütun (chat | canlı yayın | AI)
  Altta sosyal medya linkleri
====================================================== -->

<!-- ── LOGO ─────────────────────────────────────────────── -->
<div class="az-logo-bar">
  <a href="/{{lang}}/" style="cursor: pointer;">
    <img src="/img/{{logo}}?v={{random}}" alt="{{web-name}}" loading="lazy" />
  </a>
</div>

<!-- ── MOBİL ALT MENÜ (≤1200px) ─────────────────────────── -->
<nav class="az-mobile-nav">
  <ul>
    <li class="az-nav-item">
      <a href="/{{lang}}/" style="cursor: pointer;">
        <span class="material-symbols-outlined">home</span>
        <span>Anasayfa</span>
      </a>
    </li>
    <li class="az-nav-item">
      <a href="/{{lang}}/hakkimizda" style="cursor: pointer;">
        <span class="material-symbols-outlined">info</span>
        <span>Bilgi</span>
      </a>
    </li>
    <li class="az-nav-item az-nav-play az-mobile-play" style="cursor: pointer;">
      <span class="material-symbols-outlined az-nav-play-icon">play_circle</span>
      <span class="az-nav-play-label">Canlı</span>
    </li>
    <li class="az-nav-item">
      <a href="/{{lang}}/login" style="cursor: pointer;">
        <span class="material-symbols-outlined">person</span>
        <span>Profil</span>
      </a>
    </li>
  </ul>
</nav>

<!-- ── 3 SÜTUNLU ANA İÇERİK ─────────────────────────────── -->
<div class="az-main">

  <!-- SOL: Dinleyici Yorumları -->
  <div class="az-panel az-panel-chat">
    <div class="az-panel-head">
      <h3>Dinleyici Yorumları</h3>
      <span class="az-dot az-dot-green"></span>
    </div>
    <div id="arzcdr-profanity-warning" class="az-warning" role="alert" aria-live="polite" style="display:none;">
      Küfretmek yasaktır. Lütfen ifadenizi düzeltin.
    </div>
    <div id="messages" class="az-messages"></div>
    <div class="az-input-row">
      <input id="msgInput" type="text" placeholder="Yorumunuzu yazın..." class="az-input" />
      <button id="sendBtn" type="button" class="az-send-btn" title="Gönder" style="cursor: pointer;">
        <span class="material-symbols-outlined">send</span>
      </button>
    </div>
  </div>

  <!-- ORTA: Canlı Yayın -->
  <div class="az-panel az-panel-live">
    <div class="az-panel-head">
      <h3>Canlı Yayın</h3>
      <span class="az-live-badge">CANLI</span>
    </div>
    <div class="az-live-body">
      <div class="az-freq">
        <span class="az-freq-num">90.0</span>
        <span class="az-freq-fm">FM</span>
      </div>
      <button id="playBtn" type="button" class="az-play-btn" title="Oynat / Duraklat" style="cursor: pointer;">
        <span class="material-symbols-outlined">play_arrow</span>
      </button>
      <audio id="radioPlayer" src="https://sslyayin.netyayin.net/veradyo/stream" preload="none"></audio>
      <p class="az-live-hint">Play butonuna tıklayarak dinleyin</p>
    </div>
  </div>

  <!-- SAĞ: AI Radyo Asistanı -->
  <div class="az-panel az-panel-ai">
    <div class="az-panel-head az-panel-head-ai">
      <div class="az-ai-title">
        <span class="az-ai-icon">&#9835;</span>
        <h3>AI Radyo Asistanı</h3>
      </div>
      <div class="az-ai-status">
        <span class="az-dot az-dot-green"></span>
        <span>Çevrimiçi</span>
      </div>
    </div>
    <div id="aiMessages" class="az-ai-messages"></div>
    <div class="az-input-row az-input-row-ai">
      <input id="aiInput" type="text" placeholder="Radyo hakkında soru sorun..." class="az-input" />
      <button id="aiSendBtn" type="button" class="az-send-btn az-send-btn-ai" title="Gönder" style="cursor: pointer;">
        <span class="material-symbols-outlined">send</span>
      </button>
    </div>
  </div>

</div>

<!-- ── SOSYAL MEDYA ALANI ────────────────────────────────── -->
<div class="az-soc-wrap">
  <div class="az-soc-inner">
    
    <div class="az-soc-icons">{{html}}</div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════
  STYLES
══════════════════════════════════════════════════════ -->
<style>
  /* ─ Genel sıfırlama ─────────────────────────────────── */
  .az-logo-bar,
  .az-main,
  .az-panel,
  .az-social-bar {
    box-sizing: border-box;
    
  }

  /* ─ Logo alanı ──────────────────────────────────────── */
  .az-logo-bar {
    width: 100%;
    max-width: var(--max);
    margin: 0 auto 20px auto;
    padding: 16px 20px;
    background: #fff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .az-logo-bar img {

    width: 200px;
    object-fit: contain;
  }

  /* ─ 3 sütunlu ana alan ──────────────────────────────── */
  .az-main {
    width: 100%;
    max-width: var(--max);
    margin: 0 auto 24px auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    align-items: stretch;
  }

  /* ─ Panel (kart) genel ──────────────────────────────── */
  .az-panel {
    background: #fff;
    border-radius: 20px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .az-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }

  .az-panel-head h3 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    color: #222;
  }

  /* ─ Nokta indikatörler ──────────────────────────────── */
  .az-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    animation: az-pulse 2s infinite;
  }

  .az-dot-green {
    background: #22c55e;
    box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
  }

  @keyframes az-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ─ SOL: Chat mesaj listesi ─────────────────────────── */
  .az-messages {
    flex: 1;
    min-height: 360px;
    max-height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
  }

  .az-messages::-webkit-scrollbar { width: 5px; }
  .az-messages::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 3px; }
  .az-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 3px; }

  /* Yorum kartı */
  .az-msg-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.04);
    border-radius: 12px;
    transition: background 0.2s;
  }

  .az-msg-card:hover {
    background: rgba(0, 0, 0, 0.07);
  }

  .az-msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
    border: 2px solid rgba(0, 0, 0, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e0e0e0;
    font-size: 15px;
    font-weight: 700;
    color: #555;
  }

  .az-msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .az-msg-name {
    font-size: 14px;
    font-weight: 600;
    color: #333;
  }

  .az-msg-text {
    font-size: 13px;
    color: #666;
  }

  /* ─ Küfür uyarısı ───────────────────────────────────── */
  .az-warning {
    margin: 0 16px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(200, 60, 50, 0.1);
    border: 1px solid rgba(200, 60, 50, 0.3);
    color: #b52a20;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
  }

  /* ─ Ortak input satırı ──────────────────────────────── */
  .az-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid rgba(0, 0, 0, 0.07);
    background: #fafafa;
  }

  .az-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: #333;
  }

  .az-input::placeholder {
    color: #aaa;
  }

  .az-send-btn {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
    color: #555;
    flex-shrink: 0;
  }

  .az-send-btn .material-symbols-outlined {
    font-size: 18px;
  }

  .az-send-btn:hover {
    background: rgba(0, 0, 0, 0.16);
    transform: scale(1.05);
  }

  /* ─ ORTA: Canlı yayın paneli ────────────────────────── */
  .az-panel-live {
    border-color: rgba(238, 90, 36, 0.25);
    box-shadow: 0 4px 20px rgba(238, 90, 36, 0.08), 0 2px 8px rgba(0,0,0,0.06);
  }

  .az-panel-live .az-panel-head {
    border-bottom-color: rgba(238, 90, 36, 0.15);
  }

  .az-live-badge {
    background: #ee5a24;
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    animation: az-pulse 2s infinite;
  }

  .az-live-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 32px 20px;
  }

  .az-freq {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .az-freq-num {
    font-size: 52px;
    font-weight: 800;
    color: #ee5a24;
    line-height: 1;
  }

  .az-freq-fm {
    font-size: 20px;
    font-weight: 600;
    color: #888;
  }

  .az-play-btn {
    width: 72px;
    height: 72px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
    box-shadow: 0 6px 20px rgba(238, 90, 36, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .az-play-btn .material-symbols-outlined {
    font-size: 38px;
    color: #fff;
  }

  .az-play-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 28px rgba(238, 90, 36, 0.5);
  }

  .az-live-hint {
    margin: 0;
    font-size: 13px;
    color: #aaa;
    text-align: center;
  }

  /* ─ SAĞ: AI Asistan paneli ──────────────────────────── */
  .az-panel-ai {
    border-color: rgba(238, 90, 36, 0.15);
    box-shadow: 0 4px 20px rgba(238, 90, 36, 0.06), 0 2px 8px rgba(0,0,0,0.06);
  }

  .az-panel-head-ai {
    background: linear-gradient(135deg, rgba(238,90,36,0.05) 0%, rgba(255,107,107,0.03) 100%);
    border-bottom: 2px solid rgba(238, 90, 36, 0.12);
  }

  .az-ai-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .az-ai-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #ee5a24 0%, #ff6b6b 100%);
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(238, 90, 36, 0.3);
  }

  .az-panel-head-ai h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: #222;
  }

  .az-ai-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #555;
    padding: 5px 12px;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    border: 1px solid rgba(238, 90, 36, 0.18);
  }

  .az-ai-messages {
    flex: 1;
    min-height: 300px;
    max-height: 380px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    background: #f8f9fa;
  }

  .az-ai-messages::-webkit-scrollbar { width: 5px; }
  .az-ai-messages::-webkit-scrollbar-track { background: #eef0f3; border-radius: 3px; }
  .az-ai-messages::-webkit-scrollbar-thumb { background: rgba(238,90,36,0.2); border-radius: 3px; }
  .az-ai-messages::-webkit-scrollbar-thumb:hover { background: rgba(238,90,36,0.38); }

  /* AI mesaj balonu */
  .az-ai-msg {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 90%;
  }

  .az-ai-msg.az-ai-msg-user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .az-ai-msg.az-ai-msg-bot {
    align-self: flex-start;
  }

  .az-ai-msg-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
  }

  .az-ai-msg-user .az-ai-msg-avatar {
    background: linear-gradient(135deg, #ee5a24 0%, #ff6b6b 100%);
  }

  .az-ai-msg-bot .az-ai-msg-avatar {
    background: linear-gradient(135deg, #64748b 0%, #475569 100%);
  }

  .az-ai-msg-text {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    box-sizing: border-box;
  }

  .az-ai-msg-user .az-ai-msg-text {
    background: linear-gradient(135deg, #ee5a24 0%, #e85a20 100%);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(238, 90, 36, 0.22);
  }

  .az-ai-msg-bot .az-ai-msg-text {
    background: #fff;
    color: #334155;
    border: 1px solid rgba(0, 0, 0, 0.07);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  /* AI input satırı */
  .az-input-row-ai {
    border-top-color: rgba(238, 90, 36, 0.12);
  }

  .az-input-row-ai:focus-within {
    outline: none;
    box-shadow: inset 0 0 0 2px rgba(238, 90, 36, 0.2);
  }

  .az-send-btn-ai {
    background: linear-gradient(135deg, #ee5a24 0%, #ff6b6b 100%);
    color: #fff;
    box-shadow: 0 3px 10px rgba(238, 90, 36, 0.3);
  }

  .az-send-btn-ai:hover {
    background: linear-gradient(135deg, #d44d1c 0%, #ee5a24 100%);
  }

  .az-send-btn-ai .material-symbols-outlined {
    color: #fff;
  }

  /* ─ Sosyal medya alanı ──────────────────────────────── */
  .az-soc-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .az-soc-inner {
    width: calc(var(--max) - 40px);
    background-color: --bgcolor--;
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    box-sizing: border-box;
  }

  /* Başlık satırı: çizgi — yazı — çizgi */
  .az-soc-header {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    justify-content: center;
  }

  .az-soc-line {
    flex: 1;
    height: 1px;
    background: --color--;
    opacity: 0.25;
    max-width: 160px;
  }

  .az-soc-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: --color--;
    white-space: nowrap;
  }

  /* İkon satırı */
  .az-soc-icons {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .az-soc-icons a {
    display: inline-block;
  }

  .az-soc-icons .modulex2-media {
    width: 36px;
    height: 36px;
    border-radius: 14px;
    object-fit: cover;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  }

  .az-soc-icons .modulex2-media:hover {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
  }

  /* ─ Alt navigasyon — tüm ekranlarda sabit ───────────── */
  .az-mobile-nav {
    display: block;
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: var(--max);
    z-index: 1000;
  }

  .az-mobile-nav ul {
    list-style: none;
    margin: 0;
    padding: 0 12px;
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    align-items: flex-end;
    background: #ee5a24;
    border-top: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 32px rgba(238, 90, 36, 0.4);
    min-height: 58px;
    box-sizing: border-box;
  }

  .az-nav-item {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .az-nav-item > a {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 10px 4px 8px;
    text-decoration: none;
    color: rgba(255, 255, 255, 0.7);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.01em;
    border-radius: 10px;
    transition: color 0.2s, background 0.2s;
    width: 100%;
  }

  .az-nav-item > a .material-symbols-outlined {
    font-size: 22px;
    color: inherit;
    transition: transform 0.2s;
  }

  .az-nav-item > a:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
  }

  .az-nav-item > a:hover .material-symbols-outlined {
    transform: translateY(-2px);
  }

  .az-nav-item.az-nav-active > a {
    color: #fff;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
  }

  .az-nav-item.az-nav-active > a .material-symbols-outlined {
    color: #fff;
  }

  .az-nav-play {
    flex: 0 0 64px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 8px;
    margin: 0 4px;
    cursor: pointer;
  }

  .az-nav-play-icon {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-size: 46px;
    line-height: 1;
    display: block;
    color: #fff;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.3);
    outline: 2px solid rgba(255, 255, 255, 0.5);
    margin-top: -20px;
    transition: color 0.2s, background 0.2s, transform 0.2s, outline-color 0.2s;
  }

  .az-nav-play-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.04em;
    margin-top: 3px;
  }

  .az-nav-play:hover .az-nav-play-icon {
    transform: scale(1.08);
  }

  .az-nav-play.playing .az-nav-play-icon {
    color: #ee5a24;
    background: #fff;
    outline-color: rgba(255, 255, 255, 0.7);
    animation: az-play-ring 1.8s ease-in-out infinite;
  }

  @keyframes az-play-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6); }
    50%       { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
  }

  /* İçerik menünün altına kaymasın */
  .az-main {
    padding-bottom: 20px;
  }

  .az-soc-wrap {
    padding-bottom: 96px;
  }

  /* ─ Responsive ──────────────────────────────────────── */
  @media (max-width: 1200px) {
    /* Grid: tek sütun, canlı yayın paneli en üste (order ile) */
    .az-main {
      grid-template-columns: 1fr;
      width: calc(var(--max) - 40px);
      max-width: calc(100% - 40px);
      padding-bottom: 76px;
    }

    .az-panel-live { order: 1; }
    .az-panel-chat { order: 2; }
    .az-panel-ai   { order: 3; }

    .az-logo-bar {
      width: calc(var(--max) - 40px);
      max-width: calc(100% - 40px);
    }

    .az-soc-inner {
      width: calc(var(--max) - 40px);
      max-width: calc(100% - 40px);
      padding: 24px 16px;
    }

    .az-soc-icons .modulex2-media {
      width: 44px;
      height: 44px;
      border-radius: 10px;
    }

  }

  @media (max-width: 768px) {
    
    .az-messages,
    .az-ai-messages {
      min-height: 260px;
      max-height: 300px;
    }

    .az-freq-num {
      font-size: 40px;
    }

    .az-play-btn {
      width: 60px;
      height: 60px;
    }

    .az-play-btn .material-symbols-outlined {
      font-size: 30px;
    }
  }
</style>

<!-- ══════════════════════════════════════════════════════
  SCRIPTS
══════════════════════════════════════════════════════ -->
<script>
  /* ── Play / Pause ────────────────────────────────────── */
  (function () {
    var radioPlayer;
    var isPlaying = false;

    function updatePlayIcons() {
      /* Ana play butonu ikonu */
      var mainBtn = document.getElementById("playBtn");
      if (mainBtn) {
        var mainSym = mainBtn.querySelector(".material-symbols-outlined");
        if (mainSym) mainSym.textContent = isPlaying ? "pause" : "play_arrow";
      }
      /* Mobil play butonu: ikon + playing class */
      var mobilePlay = document.querySelector(".az-mobile-play");
      if (mobilePlay) {
        var mobileSym = mobilePlay.querySelector(".az-nav-play-icon");
        if (mobileSym) mobileSym.textContent = isPlaying ? "pause" : "play_circle";
        if (isPlaying) {
          mobilePlay.classList.add("playing");
        } else {
          mobilePlay.classList.remove("playing");
        }
      }
    }

    function togglePlay() {
      if (!radioPlayer) return;
      if (isPlaying) {
        radioPlayer.pause();
      } else {
        radioPlayer.play();
      }
    }

    function bindPlayer() {
      radioPlayer = document.getElementById("radioPlayer");
      if (!radioPlayer) return;

      var playBtn = document.getElementById("playBtn");
      if (playBtn) playBtn.addEventListener("click", togglePlay);

      var mobileBtns = document.querySelectorAll(".az-mobile-play");
      for (var i = 0; i < mobileBtns.length; i++) {
        mobileBtns[i].addEventListener("click", togglePlay);
      }

      radioPlayer.addEventListener("play", function () { isPlaying = true; updatePlayIcons(); });
      radioPlayer.addEventListener("pause", function () { isPlaying = false; updatePlayIcons(); });
      radioPlayer.addEventListener("error", function () { isPlaying = false; updatePlayIcons(); });
    }

    setTimeout(bindPlayer, 100);
  })();

  /* ── Chat + AI ───────────────────────────────────────── */
  var apiurl = "https://{{domain}}/api";
  var CHATLIST_API = (apiurl && apiurl.indexOf("{{") === -1) ? (apiurl.replace(/\/+$/, "") + "/chatlist") : "";
  var CHAT_API = (apiurl && apiurl.indexOf("{{") === -1) ? (apiurl.replace(/\/+$/, "") + "/chat") : "";
  var AI_ASSISTANT_API = "";

  var azMessagesDiv, azInput, azSendBtn;
  var azAiDiv, azAiInput, azAiSendBtn;
  var azChatInterval;

  /* Kullanıcı giriş kontrolü */
  function azIsLoggedIn() {
    try {
      return !!(typeof localStorage !== "undefined" && localStorage.getItem("loginToken"));
    } catch (e) {
      return false;
    }
  }

  /* Login sayfasına yönlendir */
  function azGoLogin() {
    var parts = (window.location.pathname || "").split("/").filter(Boolean);
    var lang = parts[0] || "tr";
    try {
      window.location.assign("/" + lang + "/login/");
    } catch (e) {
      window.location.href = "/" + lang + "/login/";
    }
  }

  /* Input durumlarını güncelle */
  function azSetInputState() {
    var loggedIn = azIsLoggedIn();
    if (azInput) {
      azInput.readOnly = !loggedIn;
      azInput.placeholder = loggedIn ? "Yorumunuzu yazın..." : "Yorum yazmak için giriş yapın...";
    }
    if (azAiInput) {
      azAiInput.readOnly = !loggedIn;
      azAiInput.placeholder = loggedIn ? "Radyo hakkında soru sorun..." : "Yazmak için giriş yapın...";
    }
  }

  /* Yorum mesajı DOM'a ekle */
  function azAddMsg(user, text, avatar) {
    var card = document.createElement("div");
    card.className = "az-msg-card";

    var avatarEl = document.createElement("div");
    avatarEl.className = "az-msg-avatar";
    if (avatar) {
      var img = document.createElement("img");
      img.src = avatar;
      img.alt = user || "";
      avatarEl.appendChild(img);
    } else {
      avatarEl.textContent = user ? user.charAt(0).toUpperCase() : "?";
    }

    var info = document.createElement("div");
    var nameEl = document.createElement("div");
    nameEl.className = "az-msg-name";
    nameEl.textContent = user || "Dinleyici";
    var textEl = document.createElement("div");
    textEl.className = "az-msg-text";
    textEl.textContent = text || "";
    info.appendChild(nameEl);
    info.appendChild(textEl);

    card.appendChild(avatarEl);
    card.appendChild(info);
    azMessagesDiv.appendChild(card);
    azMessagesDiv.scrollTop = azMessagesDiv.scrollHeight;
  }

  /* API'den yorum listesi çek */
  function azLoadComments() {
    if (!azMessagesDiv) return;
    if (!CHATLIST_API) {
      azMessagesDiv.innerHTML = "";
      return;
    }
    fetch(CHATLIST_API)
      .then(function (res) { return res.ok ? res.json() : Promise.reject(res); })
      .then(function (data) {
        azMessagesDiv.innerHTML = "";
        var list = (data && data.ok && data.list) ? data.list : (Array.isArray(data) ? data : (data && (data.items || data.list)) || []);
        for (var i = 0; i < list.length; i++) {
          var item = list[i];
          azAddMsg(
            item.user || item.author || item.name || "Dinleyici",
            item.text || item.content || item.message || item.yorum || "",
            item.avatar || item.image || ""
          );
        }
      })
      .catch(function () { azMessagesDiv.innerHTML = ""; });
  }

  /* Küfür uyarısını göster */
  function azShowWarning() {
    var el = document.getElementById("arzcdr-profanity-warning");
    if (!el) return;
    el.style.display = "block";
    clearTimeout(azShowWarning._t);
    azShowWarning._t = setTimeout(function () { el.style.display = "none"; }, 5000);
  }

  /* Yorum gönder */
  function azSendComment() {
    if (!azIsLoggedIn()) { azGoLogin(); return; }
    var text = (azInput.value || "").trim();
    if (!text) return;
    if (CHAT_API) {
      var token = "";
      try { token = localStorage.getItem("loginToken") || ""; } catch (e) {}
      fetch(CHAT_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, yorum: text })
      })
        .then(function (res) { return res.ok ? res.json() : Promise.reject(res); })
        .then(function (data) {
          if (data && data.ok) {
            azInput.value = "";
            azLoadComments();
          } else {
            if (data && data.error && data.error.indexOf("küfür") !== -1) azShowWarning();
            else if (data && data.error) alert(data.error);
          }
        })
        .catch(function (err) {
          if (err && typeof err.json === "function") {
            err.json().then(function (b) {
              if (b && b.error) {
                if (b.error.indexOf("küfür") !== -1) azShowWarning();
                else alert(b.error);
              }
            }).catch(function () {});
          }
        });
    } else {
      azAddMsg("Sen", text, "");
      azInput.value = "";
    }
  }

  /* AI mesaj balonu ekle */
  function azAddAiMsg(isUser, text) {
    var wrap = document.createElement("div");
    wrap.className = "az-ai-msg " + (isUser ? "az-ai-msg-user" : "az-ai-msg-bot");

    var av = document.createElement("div");
    av.className = "az-ai-msg-avatar";
    av.textContent = isUser ? "S" : "AI";

    var bubble = document.createElement("div");
    bubble.className = "az-ai-msg-text";
    bubble.textContent = text || "";

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    azAiDiv.appendChild(wrap);
    azAiDiv.scrollTop = azAiDiv.scrollHeight;
  }

  /* AI yanıt al */
  function azFetchAiReply(msg, cb) {
    if (!AI_ASSISTANT_API) {
      cb("Merhaba! Radyo hakkında sorularınızı yanıtlamaya hazırım. API bağlantısı kurulduğunda yanıtlar buradan gelecek.");
      return;
    }
    fetch(AI_ASSISTANT_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(res); })
      .then(function (data) {
        cb(data.reply || data.text || data.message || data.content || "Yanıt alınamadı.");
      })
      .catch(function () { cb("Şu an yanıt alınamıyor. Lütfen daha sonra deneyin."); });
  }

  /* AI mesaj gönder */
  function azSendAiMsg() {
    if (!azIsLoggedIn()) { azGoLogin(); return; }
    var val = (azAiInput.value || "").trim();
    if (!val) return;
    azAddAiMsg(true, val);
    azAiInput.value = "";
    azFetchAiReply(val, function (reply) { azAddAiMsg(false, reply); });
  }

  /* Tüm modülü başlat */
  function azInit() {
    azMessagesDiv = document.getElementById("messages");
    azInput = document.getElementById("msgInput");
    azSendBtn = document.getElementById("sendBtn");
    azAiDiv = document.getElementById("aiMessages");
    azAiInput = document.getElementById("aiInput");
    azAiSendBtn = document.getElementById("aiSendBtn");

    if (!azMessagesDiv || !azInput || !azSendBtn) return;

    azSetInputState();

    /* Chat olayları */
    azInput.addEventListener("focus", function () { if (!azIsLoggedIn()) { azInput.blur(); azGoLogin(); } });
    azInput.addEventListener("keydown", function (e) { if (!azIsLoggedIn()) { e.preventDefault(); azGoLogin(); } });
    azInput.addEventListener("keypress", function (e) { if (e.key === "Enter") azSendComment(); });
    azSendBtn.onclick = azSendComment;

    /* AI olayları */
    if (azAiDiv && azAiInput && azAiSendBtn) {
      azAiInput.addEventListener("focus", function () { if (!azIsLoggedIn()) { azAiInput.blur(); azGoLogin(); } });
      azAiInput.addEventListener("keydown", function (e) { if (!azIsLoggedIn()) { e.preventDefault(); azGoLogin(); } });
      azAiInput.addEventListener("keypress", function (e) { if (e.key === "Enter") azSendAiMsg(); });
      azAiSendBtn.onclick = azSendAiMsg;
      azAddAiMsg(false, "Merhaba! Ben Veradyo AI asistanıyım. Radyo hakkında sorularınızı yanıtlamaya hazırım.");
    }

    /* Yorumları yükle, her 3 sn yenile */
    azLoadComments();
    if (CHATLIST_API) {
      azChatInterval = setInterval(azLoadComments, 3000);
      window.addEventListener("beforeunload", function () { clearInterval(azChatInterval); });
    }
  }

  /* Aktif sayfayı mobil menüde işaretle */
  (function () {
    function azMarkActiveNav() {
      var path = window.location.pathname || "";
      var navLinks = document.querySelectorAll(".az-nav-item > a");
      for (var i = 0; i < navLinks.length; i++) {
        var href = navLinks[i].getAttribute("href") || "";
        var li = navLinks[i].parentElement;
        if (href && path === href || (href.length > 3 && path.indexOf(href) === 0)) {
          li.classList.add("az-nav-active");
        } else {
          li.classList.remove("az-nav-active");
        }
      }
    }
    setTimeout(azMarkActiveNav, 100);
  })();

  setTimeout(azInit, 100);
</script>
