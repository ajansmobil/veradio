<div class="modulex-body">
  <div class="modulex">
    <div class="chat-section">
      <div class="chat-header">
        <h3>Dinleyici Yorumları</h3>
        <div class="online-indicator">
          <span class="online-dot"></span>

        </div>
      </div>
      <div id="arzcdr-profanity-warning" class="arzcdr-profanity-warning" role="alert" aria-live="polite" style="display: none;">
        Küfretmek yasaktır. Lütfen ifadenizi düzeltin.
      </div>
      <div id="messages" class="messages-youtube"></div>
      <div class="messages-youtube-input">
        <input id="msgInput" type="text" placeholder="Yorumunuzu yazın..." class="messages-youtube-input-input" />
        <button class="input-icon" id="sendBtn" type="button" title="Gönder">
          <span class="material-symbols-outlined" aria-hidden="true">arrow_forward_ios</span>
        </button>
      </div>
    </div>

    <div class="ai-chat-section">
      <div class="ai-chat-header">
        <div class="ai-chat-title-wrap">
          <span class="ai-chat-icon" aria-hidden="true">&#9835;</span>
          <h3>AI Radyo Asistanı</h3>
        </div>
        <div class="ai-status">
          <span class="ai-dot"></span>
          <span>Çevrimiçi</span>
        </div>
      </div>
      <div id="aiMessages" class="ai-messages"></div>
      <div class="ai-input-section">
        <input id="aiInput" type="text" placeholder="Radyo hakkında soru sorun..." class="ai-input" />
        <button class="ai-send-btn" id="aiSendBtn" type="button" title="Gönder">
          <span class="material-symbols-outlined" aria-hidden="true">arrow_forward_ios</span>
        </button>
      </div>
    </div>
  </div>
</div>
<style>
  .modulex {
    width: var(--max);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #333333;
    gap: 20px;
  }

  .modulex-body {
    width: 100%;

    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #333333;
  }

  .chat-section {
    width: 100%;
    background: rgba(255, 255, 255, 0.95);

    padding: 20px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 18px;

  .chat-header {
    display: flex;

  .online-indicator {

  .online-dot {
    width: 7px;

  @keyframes pulse {

  .messages-youtube {

  .message-card {

  .message-avatar {

  /* Küfür uyarısı: ekranda "Küfretmek yasaktır" mesajı */
  .arzcdr-profanity-warning {

  /* Scrollbar styling */

  .messages-youtube::-webkit-scrollbar-thumb:hover {

  }

  /* --- AI Radyo Asistanı: Veradio marka rengi ve modern sohbet görünümü --- */
  .ai-chat-section {
    background: #ffffff;
    border-radius: 20px;
    padding: 0;
    border: 1px solid rgba(238, 90, 36, 0.15);

  .ai-chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 22px;
    background: linear-gradient(135deg, rgba(238, 90, 36, 0.06) 0%, rgba(255, 107, 107, 0.04) 100%);

  .ai-chat-title-wrap {
    display: flex;

  .ai-chat-icon {

  .ai-chat-header h3 {

  .ai-status {
    display: flex;

  .ai-dot {
    width: 8px;

  .ai-messages {

  .ai-message {

  .ai-message.user {

  .ai-message.ai {

  .ai-avatar {
    width: 34px;

    letter-spacing: -0.03em;
  }

  .ai-avatar.ai {
    font-size: 10px;
    letter-spacing: 0.02em;
  }

  .ai-avatar.user {
    background: linear-gradient(135deg, #ee5a24 0%, #ff6b6b 100%);

  }

  .ai-avatar.ai {
    background: linear-gradient(135deg, #64748b 0%, #475569 100%);

  .ai-message-content {

  .ai-message.user .ai-message-content {

  .ai-message.ai .ai-message-content {

  }

  .ai-input-section {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #ffffff;
    border-radius: 16px;
    margin: 16px;
    padding: 10px 14px 10px 20px;
    border: 2px solid #e5e7eb;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .ai-input-section:focus-within {
    border-color: #ee5a24;
    box-shadow: 0 0 0 4px rgba(238, 90, 36, 0.12);
  }

  .ai-input {
    flex: 1;

  .ai-input::placeholder {

  .ai-send-btn {

  .ai-send-btn:hover {
    transform: scale(1.05);

  .ai-send-btn:active {

  .ai-send-icon {

  /* AI mesaj alanı scrollbar — Veradio tonu */
  .ai-messages::-webkit-scrollbar {

  .ai-messages::-webkit-scrollbar-track {

  .ai-messages::-webkit-scrollbar-thumb {

  @media (max-width: 1200px) {

</style>

<script>




  // Modül kuralı: iç API her zaman https://{{domain}}/api (login index.html 59-60 ile aynı; {{domain}} render'da doldurulur)
  var apiurl = "https://{{domain}}/api";
  var CHATLIST_API = (apiurl && apiurl.indexOf("{{") === -1) ? (apiurl.replace(/\/+$/, "") + "/chatlist") : "";
  var CHAT_API = (apiurl && apiurl.indexOf("{{") === -1) ? (apiurl.replace(/\/+$/, "") + "/chat") : "";





  var AI_ASSISTANT_API = ""; // Backend: AI radyo asistanı yanıt endpoint

  var messagesDiv, input, sendBtn;
  var chatListInterval; // 3 sn'de bir chat listesini yenilemek için

  /** Üye girişi yapılmış mı? (loginToken localStorage'da tutuluyor) */
  function arzcdrIsLoggedIn() {
    try {
      return !!(typeof localStorage !== "undefined" && localStorage.getItem("loginToken"));
    } catch (e) {
      return false;
    }
  }

  /** Giriş yapılmamışsa kullanıcıyı login sayfasına yönlendirir. */
  function arzcdrRedirectToLogin() {
    var path = window.location.pathname || "";
    var parts = path.split("/").filter(Boolean);
    var lang = parts[0] || "tr";
    var loginUrl = "/" + lang + "/login/";
    try {
      window.location.assign(loginUrl);
    } catch (e) {
      window.location.href = loginUrl;
    }
  }

  /** Giriş yapılmamışsa yorum ve AI inputlarını yazılamaz yapar, tıklanınca login'e gider. */
  function arzcdrApplyGuestState() {
    if (!input) return;
    input.readOnly = true;
    input.placeholder = "Yorum yazmak için giriş yapın...";
    if (aiInput) {
      aiInput.readOnly = true;
      aiInput.placeholder = "Yazmak için giriş yapın...";
    }
  }

  /** Giriş yapılmışsa inputları yazılabilir yapar. */
  function arzcdrApplyLoggedInState() {
    if (!input) return;
    input.readOnly = false;
    input.placeholder = "Yorumunuzu yazın...";
    if (aiInput) {
      aiInput.readOnly = false;
      aiInput.placeholder = "AI'ya sorunuzu yazın...";
    }
  }

  function arzcdrInit() {
    messagesDiv = document.getElementById("messages");
    input = document.getElementById("msgInput");
    sendBtn = document.getElementById("sendBtn");
    aiMessagesDiv = document.getElementById("aiMessages");
    aiInput = document.getElementById("aiInput");
    aiSendBtn = document.getElementById("aiSendBtn");

    if (!messagesDiv || !input || !sendBtn) return;

    if (arzcdrIsLoggedIn()) {
      arzcdrApplyLoggedInState();
    } else {
      arzcdrApplyGuestState();
    }

    setupEventListeners();
    if (aiMessagesDiv && aiInput && aiSendBtn) {
      setupAiEventListeners();
      initializeAI();
    }
    loadListenerCommentsFromApi();
    if (CHATLIST_API) {
      chatListInterval = setInterval(loadListenerCommentsFromApi, 3000);
      window.addEventListener("beforeunload", function () { clearInterval(chatListInterval); });
    }
  }

  setTimeout(arzcdrInit, 100);

  /** API'den dinleyici yorumlarını çekip listeler. Veradyo: GET /api/chatlist → { ok, list: [{ name, yorum }] }. */
  function loadListenerCommentsFromApi() {
    if (!CHATLIST_API) {
      messagesDiv.innerHTML = "";
      return;
    }
    fetch(CHATLIST_API)
      .then(function (res) { return res.ok ? res.json() : Promise.reject(res); })
      .then(function (data) {
        messagesDiv.innerHTML = "";
        var list = (data && data.ok && data.list) ? data.list : (Array.isArray(data) ? data : (data && (data.items || data.list)) || []);
        list.forEach(function (item) {
          addMessage(
            item.user || item.author || item.name || "Dinleyici",
            item.text || item.content || item.message || item.yorum || "",
            item.avatar || item.image || ""
          );
        });
        if (messagesDiv.scrollHeight) messagesDiv.scrollTop = messagesDiv.scrollHeight;
      })
      .catch(function () {
        messagesDiv.innerHTML = "";
      });
  }

  /** Tek bir yorum kartı DOM'a ekler (API verisi: user, text, avatar). */
  function addMessage(user, text, avatar) {
    var card = document.createElement("div");
    card.classList.add("message-card");
    var avatarDiv = document.createElement("div");
    avatarDiv.classList.add("message-avatar");
    avatarDiv.innerHTML = avatar
      ? '<img src="' + avatar + '" alt="' + (user || "") + '">'
      : '<span style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#ddd;font-size:14px;">' + (user ? user.charAt(0).toUpperCase() : "?") + "</span>";
    var info = document.createElement("div");
    info.classList.add("message-info");
    var name = document.createElement("div");
    name.classList.add("message-user");
    name.textContent = user || "Dinleyici";
    var messageText = document.createElement("div");
    messageText.classList.add("message-text");
    messageText.textContent = text || "";
    info.appendChild(name);
    info.appendChild(messageText);
    card.appendChild(avatarDiv);
    card.appendChild(info);
    messagesDiv.appendChild(card);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  /** Küfür uyarısını ekranda gösterir; birkaç saniye sonra gizler. */
  function showProfanityWarning() {
    var el = document.getElementById("arzcdr-profanity-warning");
    if (!el) return;
    el.style.display = "block";
    clearTimeout(showProfanityWarning._hideTimer);
    showProfanityWarning._hideTimer = setTimeout(function () {
      el.style.display = "none";
    }, 5000);
  }

  /** Yorum gönderir. Veradyo: POST /api/chat { token, yorum }. Küfür varsa ekranda "Küfretmek yasaktır" uyarısı. */
  function sendComment(text) {
    if (!arzcdrIsLoggedIn()) {
      arzcdrRedirectToLogin();
      return;
    }
    var trimmed = (text || "").trim();
    if (!trimmed) return;
    if (CHAT_API) {
      var token = typeof localStorage !== "undefined" ? localStorage.getItem("loginToken") : "";
      fetch(CHAT_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token || "", yorum: trimmed }),
      })
        .then(function (res) { return res.ok ? res.json() : Promise.reject(res); })
        .then(function (data) {
          if (data && data.ok) {
            input.value = "";
            loadListenerCommentsFromApi();
          } else {
            input.value = trimmed;
            if (data && data.error && data.error.indexOf("küfür") !== -1) {
              showProfanityWarning();
            } else if (data && data.error) {
              alert(data.error);
            }
          }
        })
        .catch(function (err) {
          input.value = trimmed;
          if (err && typeof err.json === "function") {
            err.json().then(function (body) {
              if (body && body.error) {
                if (body.error.indexOf("küfür") !== -1) showProfanityWarning();
                else alert(body.error);
              }
            }).catch(function () {});
          }
        });
    } else {
      addMessage("Sen", trimmed, "");
      input.value = "";
    }
  }

  function setupEventListeners() {
    // Giriş yapmamış kullanıcı: yorum alanına tıklayınca/odaklanınca veya tuş basınca login'e yönlendir
    input.addEventListener("focus", function () {
      if (!arzcdrIsLoggedIn()) {
        input.blur();
        arzcdrRedirectToLogin();
      }
    });
    input.addEventListener("click", function () {
      if (!arzcdrIsLoggedIn()) arzcdrRedirectToLogin();
    });
    input.addEventListener("keydown", function (e) {
      if (!arzcdrIsLoggedIn()) {
        e.preventDefault();
        arzcdrRedirectToLogin();
      }
    });
    sendBtn.onclick = function () {
      if (!arzcdrIsLoggedIn()) {
        arzcdrRedirectToLogin();
        return;
      }
      sendComment(input.value);
    };
    input.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        if (!arzcdrIsLoggedIn()) {
          arzcdrRedirectToLogin();
          return;
        }
        sendComment(input.value);
      }
    });
  }

  // AI Radyo Asistanı — yanıtlar API'den gelecek (sabit liste ve dinleyici yorumu referansı kaldırıldı)
  var aiMessagesDiv, aiInput, aiSendBtn;

  function addAiMessage(isUser, text) {
    var messageDiv = document.createElement("div");
    messageDiv.classList.add("ai-message");
    messageDiv.classList.add(isUser ? "user" : "ai");

    var avatar = document.createElement("div");
    avatar.classList.add("ai-avatar");
    avatar.classList.add(isUser ? "user" : "ai");
    avatar.textContent = isUser ? "S" : "AI";

    var content = document.createElement("div");
    content.classList.add("ai-message-content");
    content.textContent = text || "";

    messageDiv.appendChild(avatar);
    messageDiv.appendChild(content);
    aiMessagesDiv.appendChild(messageDiv);
    aiMessagesDiv.scrollTop = aiMessagesDiv.scrollHeight;
  }

  /** AI yanıtını API'den alır; endpoint yoksa varsayılan mesaj gösterir. */
  function fetchAiResponse(userMessage, onResult) {
    if (!AI_ASSISTANT_API) {
      onResult("Merhaba! Radyo hakkında sorularınızı yanıtlamaya hazırım. API bağlantısı kurulduğunda yanıtlar buradan gelecek.");
      return;
    }
    fetch(AI_ASSISTANT_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: userMessage, text: userMessage }),
    })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(res); })
      .then(function (data) {
        var reply = data.reply || data.text || data.message || data.content || "";
        onResult(reply || "Yanıt alınamadı.");
      })
      .catch(function () {
        onResult("Şu an yanıt alınamıyor. Lütfen daha sonra tekrar deneyin.");
      });
  }

  function setupAiEventListeners() {
    // Giriş yapmamış kullanıcı: AI alanına tıklayınca/odaklanınca veya tuş basınca login'e yönlendir
    aiInput.addEventListener("focus", function () {
      if (!arzcdrIsLoggedIn()) {
        aiInput.blur();
        arzcdrRedirectToLogin();
      }
    });
    aiInput.addEventListener("click", function () {
      if (!arzcdrIsLoggedIn()) arzcdrRedirectToLogin();
    });
    aiInput.addEventListener("keydown", function (e) {
      if (!arzcdrIsLoggedIn()) {
        e.preventDefault();
        arzcdrRedirectToLogin();
      }
    });
    aiSendBtn.onclick = function () {
      if (!arzcdrIsLoggedIn()) {
        arzcdrRedirectToLogin();
        return;
      }
      var val = (aiInput.value || "").trim();
      if (!val) return;
      addAiMessage(true, val);
      aiInput.value = "";
      fetchAiResponse(val, function (reply) {
        addAiMessage(false, reply);
      });
    };

    aiInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter" && !arzcdrIsLoggedIn()) {
        arzcdrRedirectToLogin();
        return;
      }
      if (e.key !== "Enter") return;
      var val = (aiInput.value || "").trim();
      if (!val) return;
      addAiMessage(true, val);
      aiInput.value = "";
      fetchAiResponse(val, function (reply) {
        addAiMessage(false, reply);
      });
    });
  }

  function initializeAI() {
    addAiMessage(false, "Merhaba! Ben radyo AI asistanınız. Size nasıl yardımcı olabilirim?");
  }

</script>
