<!-- Tek header çubuğu: logo sol, canlı yayın bar sağ -->
<div class="modulex modulex-header-row">
  <div class="modulexbody">
    <a href="/{{lang}}/"
      ><img
        src="/img/{{logo}}?v={{random}}"
        height="--height--"
        alt="{{web-name}} Logo"
        loading="lazy"
    /></a>
  </div>

  <div class="radio-top-bar">
    <div class="radio-freq">
      <span class="freq">90.0</span>
      <span class="live-badge">CANLI DİNLE</span>
    </div>
    <div class="radio-player-bar">
      <button class="play-btn" id="playBtn">
        <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
      </button>

      <audio
        id="radioPlayer"
        src="https://sslyayin.netyayin.net/veradyo/stream"
        preload="none"
      ></audio>
    </div>
  </div>
</div>

<div class="menu-mobil-modulex">
  <ul>
    <li>
      <span class="material-symbols-outlined" aria-hidden="true">home</span>
      <a href="/{{lang}}/">Anasayfa</a>
    </li>

    <li>
      <span class="material-symbols-outlined" aria-hidden="true">home</span>
      <a href="/{{lang}}/hakkimizda">Bilgilendirme</a>
    </li>

    <li>
      <span class="material-symbols-outlined" aria-hidden="true">person</span>
      <a href="/{{lang}}/login">Profil</a>
    </li>

    <li id="playBtn">
      <span class="material-symbols-outlined">play_circle</span>
      <div>Canlı Yayın</div>
    </li>
  </ul>
</div>

<style>
  .menu-mobil-modulex {
    display: none;
  }

  @media (max-width: 1200px) {
    .menu-mobil-modulex {
      position: fixed;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      border: solid #fff;
      border-width: 2px 0px 0px 0px;
      background: #ee5a24;

      color: #333333;
      z-index: 1000;
      padding: 5px 10px 5px 10px;
      width: calc(var(--max) - 20px);
      border-radius: 10px 10px 0px 0px;
    }

    .modulex {
      display: none;
    }

    .menu-mobil-modulex ul {
      display: flex;
      flex-direction: row;
      gap: 20px;
      justify-content: space-between;
      width: 100%;
    }

    .menu-mobil-modulex ul li > * {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .menu-mobil-modulex ul li {
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 5px 10px;
      border-radius: 10px;
    }

    .menu-mobil-modulex ul li:hover {
      transform: scale(1.05);
    }

    .menu-mobil-modulex ul li.active {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .modulexmenu {
      display: none !important;
    }

    .radio-top-bar {
      margin-top: 0px !important;
      padding: 10px !important;
      width: calc(var(--max) - 40px);
    }
  }

  /* Web sürümü: tek header çubuğu, logo sol / canlı bar sağ */
  .modulex {
    width: 100%;
    max-width: var(--max);
    margin: 0 auto 20px auto;
    background: #ffffff;
    color: #333333;
  }

  .modulex-header-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  .modulextitlebodylang {
    width: auto;
    margin: -5px 0px -5px 0px;
  }

  .modulextitlebodylang ul {
    display: flex;
    gap: 5px;
  }

  .modulextitlebodylang ul a {
    color: #333333;
    text-decoration: none;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 5px;
    transition: background 0.3s;
  }

  .modulextitlebodylang ul a:hover {
    background: rgba(0, 0, 0, 0.1);
  }

  .modulextitle {
    width: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modulextitlebody {
    color: #fff;
    width: var(--max);
    display: flex;
    justify-content: space-between;
    padding: 10px 0px 10px 0px;
  }

  .modulexbody {
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  .modulexbody a {
    display: flex;
    align-items: center;
  }

  .modulexmenu {
    display: flex;
    flex-direction: row;
    gap: 20px;
    width: var(--max);
  }

  .modulexmenulist {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .modulexmenulist ul {
    width: 100%;
    list-style-type: none;
    display: flex;
    gap: 15px;
    margin: 0;
    padding: 0;
    overflow-x: auto;
  }

  .modulexmenulist ul a {
    padding: 12px 20px;
    font-size: 16px;
    color: #fff;
    border-radius: 25px;
    width: 100%;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    white-space: nowrap;
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    font-weight: 500;
  }

  .modulexmenulist ul a:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  }

  .modulex-menu-active {
    background: rgba(255, 255, 255, 0.3) !important;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  }

  .modulexmenulistbody {
    width: 100%;
  }

  /* Canlı yayın bar: header içinde sağda, daha kompakt */
  .radio-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(238, 90, 36, 0.08);
    border: 1px solid rgba(238, 90, 36, 0.2);
    color: #333;
    flex-shrink: 0;
  }

  .radio-freq {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .freq {
    font-size: 28px;
    font-weight: bold;
    color: #ee5a24;
  }

  .station {
    font-size: 28px;
    font-weight: 500;
    color: #333;
  }

  .live-badge {
    background: #ee5a24;
    color: #fff;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 0.02em;
    animation: pulse 2s infinite;
  }

  .radio-player-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .play-btn {
    width: 54px;
    height: 54px;
    background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 12px rgba(238, 90, 36, 0.35);
  }

  .play-btn .material-symbols-outlined {
    color: #fff;
    font-size: 34px;
  }

  .play-btn:hover {
    transform: scale(1.08);
  }

  @keyframes pulse {
    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.3;
    }
  }
</style>

<script>
  (function () {
    // Kritik kural: DOMContentLoaded kullanılmaz; setTimeout ile DOM hazır olana kadar bekle
    var playBtns = document.querySelectorAll("#playBtn");
    var radioPlayer = document.getElementById("radioPlayer");
    var isPlaying = false;

    function togglePlay() {
      if (isPlaying) {
        radioPlayer.pause();
        isPlaying = false;
      } else {
        radioPlayer.play();
        isPlaying = true;
      }
    }

    function updateIcons() {
      for (var i = 0; i < playBtns.length; i++) {
        var btn = playBtns[i];
        var icon = btn.querySelector(".material-symbols-outlined");
        if (icon) {
          icon.textContent = isPlaying ? "pause" : "play_arrow";
        }
        var mobileLi = btn.closest("li");
        if (mobileLi) {
          if (isPlaying) {
            mobileLi.classList.add("active");
          } else {
            mobileLi.classList.remove("active");
          }
        }
      }
    }

    function bindPlay() {
      playBtns = document.querySelectorAll("#playBtn");
      radioPlayer = document.getElementById("radioPlayer");
      if (!radioPlayer) return;

      for (var j = 0; j < playBtns.length; j++) {
        var b = playBtns[j];
        b.addEventListener("click", togglePlay);
        var li = b.closest("li");
        if (li) {
          li.addEventListener("click", togglePlay);
        }
      }

      radioPlayer.addEventListener("play", function () {
        isPlaying = true;
        updateIcons();
      });
      radioPlayer.addEventListener("pause", function () {
        isPlaying = false;
        updateIcons();
      });
      radioPlayer.addEventListener("error", function () {
        isPlaying = false;
        updateIcons();
      });
    }

    setTimeout(function () {
      bindPlay();
    }, 100);
  })();
</script>
