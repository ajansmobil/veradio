<script>
  document.addEventListener("DOMContentLoaded", function () {
    const playBtns = document.querySelectorAll("#playBtn");
    const radioPlayer = document.getElementById("radioPlayer");
    let isPlaying = false;

    function togglePlay() {
      if (isPlaying) {
        // Durdur
        radioPlayer.pause();
        isPlaying = false;
      } else {
        // Başlat
        radioPlayer.play();
        isPlaying = true;
      }
    }

    function updateIcons() {
      playBtns.forEach((btn) => {
        const icon = btn.querySelector(".material-symbols-outlined");
        if (icon) {
          icon.textContent = isPlaying ? "pause" : "play_arrow";
        }

        // Mobil menüdeki li elementini bul ve active class'ını ekle/çıkar
        const mobileLi = btn.closest("li");
        if (mobileLi) {
          if (isPlaying) {
            mobileLi.classList.add("active");
          } else {
            mobileLi.classList.remove("active");
          }
        }
      });
    }

    // Her iki butona da event listener ekle
    playBtns.forEach((btn) => {
      btn.addEventListener("click", togglePlay);

      // Mobil menüdeki li elementine de tıklama eventi ekle
      const mobileLi = btn.closest("li");
      if (mobileLi) {
        mobileLi.addEventListener("click", togglePlay);
      }
    });

    // Audio event listeners
    radioPlayer.addEventListener("play", function () {
      isPlaying = true;
      updateIcons();
    });

    radioPlayer.addEventListener("pause", function () {
      isPlaying = false;
      updateIcons();
    });

    radioPlayer.addEventListener("error", function () {
      console.log("Radio yüklenirken hata oluştu");
      isPlaying = false;
      updateIcons();
    });
  });
</script>

<script>
  const fakeMessages = [
    {
      user: "Ali",
      text: "Selam, radyo harika!",
      avatar: "https://i.pravatar.cc/40?u=ali&img=1",
    },
    {
      user: "Ayşe",
      text: "Şarkı çok iyiymiş.",
      avatar: "https://i.pravatar.cc/40?u=ayse&img=47",
    },
    {
      user: "Mehmet",
      text: "Yorumlarınızı bekliyorum.",
      avatar: "https://i.pravatar.cc/40?u=mehmet&img=11",
    },
    {
      user: "Zeynep",
      text: "Sıradaki parça ne?",
      avatar: "https://i.pravatar.cc/40?u=zeynep&img=44",
    },
    {
      user: "Can",
      text: "Güzel yayın, elinize sağlık.",
      avatar: "https://i.pravatar.cc/40?u=can&img=51",
    },
    {
      user: "Elif",
      text: "Bu şarkıyı çok seviyorum!",
      avatar: "https://i.pravatar.cc/40?u=elif&img=24",
    },
    {
      user: "Burak",
      text: "Radyo kalitesi çok iyi.",
      avatar: "https://i.pravatar.cc/40?u=burak&img=61",
    },
    {
      user: "Selin",
      text: "DJ çok güzel seçim yapıyor.",
      avatar: "https://i.pravatar.cc/40?u=selin&img=31",
    },
    {
      user: "Kemal",
      text: "Müzik zevkiniz çok iyi.",
      avatar: "https://i.pravatar.cc/40?u=kemal&img=56",
    },
  ];

  let currentMessageIndex = 0;
  let messagesDiv, input, sendBtn;

  // DOM yüklendikten sonra elementleri yakala
  document.addEventListener("DOMContentLoaded", function () {
    messagesDiv = document.getElementById("messages");
    input = document.getElementById("msgInput");
    sendBtn = document.getElementById("sendBtn");

    aiMessagesDiv = document.getElementById("aiMessages");
    aiInput = document.getElementById("aiInput");
    aiSendBtn = document.getElementById("aiSendBtn");

    // Event listener'ları burada tanımla
    setupEventListeners();
    setupAiEventListeners();
    showFakeMessages();
    startAutomaticMessages();
    initializeAI();

  });

  function addMessage(user, text, avatar) {
    const card = document.createElement("div");
    card.classList.add("message-card");
    const avatarDiv = document.createElement("div");
    avatarDiv.classList.add("message-avatar");
    avatarDiv.innerHTML = `<img src="${avatar}" alt="${user}">`;
    const info = document.createElement("div");
    info.classList.add("message-info");
    const name = document.createElement("div");
    name.classList.add("message-user");
    name.textContent = user;
    const messageText = document.createElement("div");
    messageText.classList.add("message-text");
    messageText.textContent = text;
    info.appendChild(name);
    info.appendChild(messageText);
    card.appendChild(avatarDiv);
    card.appendChild(info);
    messagesDiv.appendChild(card);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showFakeMessages() {
    messagesDiv.innerHTML = "";
    // İlk 5 yorumu göster
    for (let i = 0; i < 5; i++) {
      addMessage(
        fakeMessages[i].user,
        fakeMessages[i].text,
        fakeMessages[i].avatar,
      );
    }
    currentMessageIndex = 5; // Sonraki yorumlar için index
  }

  function addNextMessage() {
    const message = fakeMessages[currentMessageIndex];
    addMessage(message.user, message.text, message.avatar);
    currentMessageIndex = (currentMessageIndex + 1) % fakeMessages.length;
  }

  function setupEventListeners() {
    sendBtn.onclick = function () {
      if (input.value.trim()) {
        addMessage("Sen", input.value, "https://i.pravatar.cc/40?u=sen&img=7");
        input.value = "";
      }
    };

    input.addEventListener("keypress", function (e) {
      if (e.key === "Enter" && input.value.trim()) {
        addMessage("Sen", input.value, "https://i.pravatar.cc/40?u=sen&img=7");
        input.value = "";
      }
    });
  }

  // AI Chat Functions
  let aiMessagesDiv, aiInput, aiSendBtn;

  const aiResponses = [
    "Merhaba! Radyo hakkında sorularınızı yanıtlamaya hazırım. Hangi konuda yardımcı olabilirim?",
    "Şu anda çalan şarkı hakkında bilgi almak ister misiniz?",
    "Radyo frekansımız hakkında detaylı bilgi verebilirim.",
    "Dinleyici yorumlarınızı bekliyoruz!",
    "Hangi tür müzik dinlemek istiyorsunuz?",
    "Radyo programımız hakkında sorularınızı yanıtlayabilirim.",
    "Canlı yayın saatlerimiz hakkında bilgi verebilirim.",
    "Özel istek şarkılarınızı dinleyebiliriz.",
    "Radyo DJ'lerimiz hakkında bilgi almak ister misiniz?",
    "Müzik önerilerinizi bekliyoruz!",
  ];

  let currentAiResponseIndex = 0;

  function addAiMessage(isUser, text) {
    const messageDiv = document.createElement("div");
    messageDiv.classList.add("ai-message");
    messageDiv.classList.add(isUser ? "user" : "ai");

    const avatar = document.createElement("div");
    avatar.classList.add("ai-avatar");
    avatar.classList.add(isUser ? "user" : "ai");
    avatar.innerHTML = isUser ? "👤" : "🤖";

    const content = document.createElement("div");
    content.classList.add("ai-message-content");
    content.textContent = text;

    messageDiv.appendChild(avatar);
    messageDiv.appendChild(content);
    aiMessagesDiv.appendChild(messageDiv);
    aiMessagesDiv.scrollTop = aiMessagesDiv.scrollHeight;
  }

  function getNextAiResponse() {
    const response = aiResponses[currentAiResponseIndex];
    currentAiResponseIndex = (currentAiResponseIndex + 1) % aiResponses.length;
    return response;
  }

  function simulateAiResponse() {
    setTimeout(() => {
      addAiMessage(false, getNextAiResponse());
    }, 3000);
  }

  function setupAiEventListeners() {
    aiSendBtn.onclick = function () {
      if (aiInput.value.trim()) {
        addAiMessage(true, aiInput.value);
        aiInput.value = "";
        simulateAiResponse();
      }
    };

    aiInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter" && aiInput.value.trim()) {
        addAiMessage(true, aiInput.value);
        aiInput.value = "";
        simulateAiResponse();
      }
    });
  }

  function initializeAI() {
    // Initialize AI chat with welcome message
    addAiMessage(
      false,
      "Merhaba! Ben radyo AI asistanınız. Size nasıl yardımcı olabilirim?",
    );
  }

  function startAutomaticMessages() {
    // Otomatik AI yanıtları başlat
    setInterval(() => {
      addAiMessage(false, getNextAiResponse());
    }, 10000); // Her 10 saniyede bir AI yanıtı

    // Otomatik dinleyici yorumları başlat
    setInterval(() => {
      addNextMessage();
    }, 3000); // Her 3 saniyede bir yeni yorum
  }

</script>
