  <script>
    const fakeMessages = [
      { user: 'Ali', text: 'Selam, radyo harika!', avatar: 'https://i.pravatar.cc/40?u=ali' },
      { user: 'Ayşe', text: 'Şarkı çok iyiymiş.', avatar: 'https://i.pravatar.cc/40?u=ayse' },
      { user: 'Mehmet', text: 'Yorumlarınızı bekliyorum.', avatar: 'https://i.pravatar.cc/40?u=mehmet' },
      { user: 'Zeynep', text: 'Sıradaki parça ne?', avatar: 'https://i.pravatar.cc/40?u=zeynep' },
      { user: 'Can', text: 'Güzel yayın, elinize sağlık.', avatar: 'https://i.pravatar.cc/40?u=can' }
    ];
    let msgIndex = 0;
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const playBtn = document.getElementById('playBtn');
    const radioPlayer = document.getElementById('radioPlayer');
    const waveAnim = document.getElementById('waveAnim');
    let isPlaying = false;

    function addMessage(user, text, avatar) {
      const card = document.createElement('div');
      card.classList.add('message-card');
      const avatarDiv = document.createElement('div');
      avatarDiv.classList.add('message-avatar');
      avatarDiv.innerHTML = `<img src="${avatar}" alt="${user}">`;
      const info = document.createElement('div');
      info.classList.add('message-info');
      const name = document.createElement('div');
      name.classList.add('message-user');
      name.textContent = user;
      const messageText = document.createElement('div');
      messageText.classList.add('message-text');
      messageText.textContent = text;
      info.appendChild(name);
      info.appendChild(messageText);
      card.appendChild(avatarDiv);
      card.appendChild(info);
      messagesDiv.appendChild(card);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showFakeMessages() {
      messagesDiv.innerHTML = '';
      fakeMessages.forEach(m => addMessage(m.user, m.text, m.avatar));
    }

    sendBtn.onclick = function () {
      if (input.value.trim()) {
        addMessage('Sen', input.value, 'https://i.pravatar.cc/40?u=sen');
        input.value = '';
      }
    };
    input.addEventListener('keypress', function (e) {
      if (e.key === 'Enter' && input.value.trim()) {
        addMessage('Sen', input.value, 'https://i.pravatar.cc/40?u=sen');
        input.value = '';
      }
    });

    playBtn.addEventListener('click', function () {
      if (isPlaying) {
        radioPlayer.pause();
        playBtn.innerHTML = '<span class="material-symbols-outlined">play_arrow</span>';
        waveAnim.classList.remove('playing');
        isPlaying = false;
      } else {
        radioPlayer.play();
        playBtn.innerHTML = '<span class="material-symbols-outlined">pause</span>';
        waveAnim.classList.add('playing');
        isPlaying = true;
      }
    });

    showFakeMessages();
  </script>
