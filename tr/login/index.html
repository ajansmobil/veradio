<script>
  document.addEventListener('DOMContentLoaded', function () {
    const playBtns = document.querySelectorAll('#playBtn');
    const radioPlayer = document.getElementById('radioPlayer');
    let isPlaying = false;

    function togglePlay() {
      if (isPlaying) {
        // Durdur
        radioPlayer.pause();
        isPlaying = false;
      } else {
        // Başlat
        radioPlayer.play();
        isPlaying = true;
      }
    }

    function updateIcons() {
      playBtns.forEach(btn => {
        const icon = btn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = isPlaying ? 'pause' : 'play_arrow';
        }

        // Mobil menüdeki li elementini bul ve active class'ını ekle/çıkar
        const mobileLi = btn.closest('li');
        if (mobileLi) {
          if (isPlaying) {
            mobileLi.classList.add('active');
          } else {
            mobileLi.classList.remove('active');
          }
        }
      });
    }

    // Her iki butona da event listener ekle
    playBtns.forEach(btn => {
      btn.addEventListener('click', togglePlay);

      // Mobil menüdeki li elementine de tıklama eventi ekle
      const mobileLi = btn.closest('li');
      if (mobileLi) {
        mobileLi.addEventListener('click', togglePlay);
      }
    });

    // Audio event listeners
    radioPlayer.addEventListener('play', function () {
      isPlaying = true;
      updateIcons();
    });

    radioPlayer.addEventListener('pause', function () {
      isPlaying = false;
      updateIcons();
    });

    radioPlayer.addEventListener('error', function () {
      console.log('Radio yüklenirken hata oluştu');
      isPlaying = false;
      updateIcons();
    });
  });
</script>
