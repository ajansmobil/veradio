  <div class="radio-top-bar">
    <div class="radio-freq">
      <span class="station">VeRadyo</span>
      <span class="freq">90.0</span>
      <span class="live-badge">CANLI</span>
    </div>
    <div class="radio-player-bar">
      <button class="play-btn" id="playBtn">
        <span class="material-symbols-outlined">play_arrow</span>
      </button>
      <div class="wave-anim" id="waveAnim">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const playBtn = document.getElementById('playBtn');
    const radioPlayer = document.getElementById('radioPlayer');
    const waveAnim = document.getElementById('waveAnim');
    const playIcon = playBtn.querySelector('.material-symbols-outlined');

    let isPlaying = false;

    playBtn.addEventListener('click', function () {
      if (isPlaying) {
        // Durdur
        radioPlayer.pause();
        waveAnim.classList.remove('playing');
        playIcon.textContent = 'play_arrow';
        isPlaying = false;
      } else {
        // Başlat
        radioPlayer.play();
        waveAnim.classList.add('playing');
        playIcon.textContent = 'pause';
        isPlaying = true;
      }
    });

    // Audio event listeners
    radioPlayer.addEventListener('play', function () {
      waveAnim.classList.add('playing');
      playIcon.textContent = 'pause';
      isPlaying = true;
    });

    radioPlayer.addEventListener('pause', function () {
      waveAnim.classList.remove('playing');
      playIcon.textContent = 'play_arrow';
      isPlaying = false;
    });

    radioPlayer.addEventListener('error', function () {
      console.log('Radio yüklenirken hata oluştu');
      waveAnim.classList.remove('playing');
      playIcon.textContent = 'play_arrow';
      isPlaying = false;
    });
  });
</script>
